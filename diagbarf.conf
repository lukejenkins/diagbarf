# SPDX-License-Identifier: Apache-2.0
# /data/diagbarf/diagbarf.conf — config for the DIAG egress daemon (#N)
#
# Shell-sourced by diagbarf.sh (KEY=VALUE), mirroring at_tcp.conf. Launch
# flags passed to diagbarf override these. All keys are optional; with the
# file absent or fully commented, the daemon's built-in defaults apply:
#   TCP listener 0.0.0.0:12399  +  UDP broadcast bridge0:12399.
#
# Sinks (one MD reader fans out to all enabled sinks concurrently):

# TCP listener (host dials in, raw HDLC). Default ON at 0.0.0.0:12399.
#DIAG_TCP_LISTEN_ENABLE=1
#DIAG_TCP_LISTEN=0.0.0.0:12399

# UDP broadcast to the LAN-side iface (DGE1 seq-framed). Default ON, bridge0.
# SPEC may be IFACE, IFACE:PORT, or BCAST_IP:PORT (e.g. 10.0.0.255:12399).
#DIAG_UDP_BROADCAST_ENABLE=1
#DIAG_UDP_BROADCAST=bridge0:12399

# Directed UDP unicast (DGE1 seq-framed). Off unless set.
#DIAG_UDP_UNICAST=10.0.0.254:12399

# Back-compat TCP dial-out (raw HDLC, the #N push model). Off unless set.
#DIAG_TCP_DIAL=10.0.0.254:12399

# Log mask mode: only 'max' is implemented (subscribe to every code).
#DIAG_MASK=max

# Also enable the free-text F3 ext-msg debug stream (DIAG_EXT_MSG_CONFIG_F).
#DIAG_EXT_MSG_F3=0

# Loopback port the captive diag_socket_log dials (kept off the public 12399).
#DIAG_INTERNAL_PORT=12398

# diag_socket_log connect-retry count.
#DIAG_RETRY=20

# Path/name of the OEM diag_socket_log binary (default: found in PATH).
#DIAG_SOCKET_LOG=diag_socket_log

# DIAG source mode:
#   socket-log   (default) — captive OEM diag_socket_log (LV55 SDX55, CFW-3212 SDX62)
#   diag-dev               — native kernel /dev/diag, zero dependencies; the only
#                            mode for the Inseego M2000 (SDX55) which ships no
#                            diag_socket_log. Validated 2026-06-02.
#   hdlc-chardev (#N)   — HOST-SIDE on a jump box: open a serial-like CRC-HDLC
#                            DIAG chardev directly (set DIAG_DEV to /dev/mhi_DIAG or
#                            /dev/ttyUSB2). No captive process, no /dev/diag ioctl.
#DIAG_SOURCE=socket-log
# Device node for DIAG_SOURCE=diag-dev (kernel diag node, default /dev/diag) OR
# DIAG_SOURCE=hdlc-chardev (the DIAG chardev, e.g. /dev/mhi_DIAG or /dev/ttyUSB2).
#DIAG_DEV=/dev/diag
